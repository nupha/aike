[package]
name = "aike"
version = "0.1.0"
edition = "2024"

[features]
cuda = ["llama-cpp-ffi/cuda"]
metal = ["llama-cpp-ffi/metal"]
enable_eval_log = []            # 启用 DeepEval 评估日志采集

[profile.release]
panic = "abort"
overflow-checks = false
debug = false
opt-level = 3
lto = "fat"
strip = "symbols"
codegen-units = 1

[profile.release.package."*"]
overflow-checks = false
debug = false
opt-level = 3
strip = "symbols"

[dependencies]
zuqe = { path = "../../../devel/zhuque", features = [
    "crossbeam_channel",
    "serde_json_support",
] }
crossbeam = "0.8"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "net",
    "time",
    "fs",
    "io-std",
    "process",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "rustls-tls",
] }
llama-cpp-ffi = { path = "../llama-cpp-ffi", features = ["cmake_static"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
glob = "0.3"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.10"
log = "0.4"
smallvec = "1.13"
linkme = "0.3"
minijinja = { version = "2", features = ["serde"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
axum = { version = "0.8", default-features = false, features = [
    "tokio",
    "http1",
    "json",
] }
ajj = { version = "0.7", features = ["axum"] }
futures-util = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1", default-features = false, features = ["v4"] }
async-openai = { version = "0.37", default-features = false, features = [
    "chat-completion",
    "responses",
    "rustls",
] }
tokio-util = { version = "0.7", features = ["io"] }
rustyline = { version = "18", features = [
    "with-file-history",
    "custom-bindings",
] }
rustyline-derive = "0.12"
parking_lot = "0.12"
dirs = "6"
crossterm = "0.28"
nu-ansi-term = "0.50"
cron = "0.16"
chrono = { version = "0.4", default-features = false, features = ["std"] }
mdka = "2.1"
scraper = "0.22"
ego-tree = "0.10"

[[bin]]
name = "aike"
path = "src/main.rs"
