[package]
name = "aike"
version = "0.1.0"
edition = "2024"

[features]
typescript = [
    "swc_common",
    "swc_ecma_ast",
    "swc_ecma_parser",
    "swc_ecma_codegen",
    "swc_ecma_transforms_typescript",
]
llama_cpp = ["llama"]
cuda = ["llama/cuda"]
metal = ["llama/metal"]
enable_eval_log = [] # 启用 DeepEval 评估日志采集
# Browser-security layer of the Fetch API (WHATWG CORS protocol, request
# modes/tainting, client-origin resolution, referrer policy inputs). Disable
# (`--no-default-features -F typescript`) for a lean server/general-purpose
# build where every fetch behaves like a plain HTTP request.
fetch_browser = []
local_storage = ["redb"]

default = ["typescript", "fetch_browser", "local_storage"]

[profile.release]
panic = "abort"
overflow-checks = false
debug = false
opt-level = 3
lto = "fat"
strip = "symbols"
codegen-units = 1

[profile.release.package."*"]
overflow-checks = false
debug = false
opt-level = 3
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
strip = "none"
debug = true

[profile.release-with-debug.package."*"]
strip = "none"
debug = true

# The `http` crate's `HeaderValue::from_maybe_shared_unchecked` panics under
# `debug_assertions` when given bytes it considers invalid (e.g. control chars
# like 0x01 that the Fetch spec permits in header values). Build `http` without
# debug-assertions so we can send those values verbatim (see transport.rs).
[profile.dev.package."http"]
opt-level = 3
debug-assertions = false

[dependencies]
zuqe = { path = "../../../devel/zhuque", features = [
    "crossbeam_channel",
    "serde_json_support",
    "zapi",
    "persistent",
    "intl402",
] }
crossbeam = "0.8"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "net",
    "time",
    "fs",
    "io-std",
    "process",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "http2",
    "rustls",
    "cookies",
] }
llama = { path = "../llama", features = ["cmake_static"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dotenvy = "0.15"
glob = "0.3"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.10"
log = "0.4"
smallvec = "1.13"
linkme = "0.3"
minijinja = { version = "2", features = ["serde"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
axum = { version = "0.8", default-features = false, features = [
    "tokio",
    "http1",
    "json",
    "ws",
    "original-uri",
] }
rmcp = { version = "3.1", default-features = false, features = [
    "client",
    "server",
    "macros",
    "transport-io",
    "transport-async-rw",
    "transport-child-process",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
    "transport-streamable-http-client-reqwest",
] }
process-wrap = { version = "9", features = [
    "tokio1",
    "process-group",
    "job-object",
] }
futures-util = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }
uuid = { version = "1", default-features = false, features = ["v4"] }
async-openai = { version = "0.37", default-features = false, features = [
    "chat-completion",
    "responses",
    "rustls",
] }
tokio-util = { version = "0.7", features = ["io"] }
rustyline = { version = "18", features = [
    "with-file-history",
    "custom-bindings",
] }
rustyline-derive = "0.12"
parking_lot = "0.12"
dirs = "6"
crossterm = "0.28"
nu-ansi-term = "0.50"
cron = "0.16"
chrono = { version = "0.4", default-features = false, features = ["std"] }
mdka = "2.1"
scraper = "0.27"
ego-tree = "0.11"
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
] }
url = "2"
base64 = "0.22"
flate2 = "1"
sha2 = "0.11"
sha1 = "0.11"
hmac = "0.13"
aes-gcm = "0.11"
rand = "0.9"
subtle = "2"
nanosandbox = { path = "../nanosandbox" }
redb = { version = "4.2", optional = true }

# TypeScript transpilation — only compiled when typescript feature is enabled
swc_common = { version = "26", optional = true }
swc_ecma_ast = { version = "29", optional = true }
swc_ecma_parser = { version = "45", optional = true, default-features = false, features = [
    "typescript",
] }
swc_ecma_codegen = { version = "32", optional = true }
swc_ecma_transforms_typescript = { version = "55", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.0", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
] }

[[bin]]
name = "aike"
path = "src/main.rs"
