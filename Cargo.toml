[package]
name = "aike"
version = "0.1.0"
edition = "2024"

[features]
typescript = [
    "swc_common",
    "swc_ecma_ast",
    "swc_ecma_parser",
    "swc_ecma_codegen",
    "swc_ecma_transforms_typescript",
]
llama_cpp = ["llama-cpp-ffi"]
cuda = ["llama-cpp-ffi/cuda"]
metal = ["llama-cpp-ffi/metal"]
enable_eval_log = []            # 启用 DeepEval 评估日志采集
default = ["typescript"]

[profile.release]
panic = "abort"
overflow-checks = false
debug = false
opt-level = 3
lto = "fat"
strip = "symbols"
codegen-units = 1

[profile.release.package."*"]
overflow-checks = false
debug = false
opt-level = 3
strip = "symbols"

[dependencies]
zuqe = { path = "../../../devel/zhuque", features = [
    "crossbeam_channel",
    "serde_json_support",
] }
crossbeam = "0.8"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "net",
    "time",
    "fs",
    "io-std",
    "process",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "rustls",
] }
llama-cpp-ffi = { path = "../llama-cpp-ffi", features = ["cmake_static"], optional=true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dotenvy = "0.15"
glob = "0.3"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.10"
log = "0.4"
smallvec = "1.13"
linkme = "0.3"
minijinja = { version = "2", features = ["serde"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
axum = { version = "0.8", default-features = false, features = [
    "tokio",
    "http1",
    "json",
] }
rmcp = { version = "1.7", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "transport-async-rw",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }
futures-util = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1", default-features = false, features = ["v4"] }
async-openai = { version = "0.37", default-features = false, features = [
    "chat-completion",
    "responses",
    "rustls",
] }
tokio-util = { version = "0.7", features = ["io"] }
rustyline = { version = "18", features = [
    "with-file-history",
    "custom-bindings",
] }
rustyline-derive = "0.12"
parking_lot = "0.12"
dirs = "6"
crossterm = "0.28"
nu-ansi-term = "0.50"
cron = "0.16"
chrono = { version = "0.4", default-features = false, features = ["std"] }
mdka = "2.1"
scraper = "0.22"
ego-tree = "0.10"
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
] }
url = "2"
base64 = "0.22"

# TypeScript transpilation — only compiled when typescript feature is enabled
swc_common = { version = "23", optional = true }
swc_ecma_ast = { version = "25", optional = true }
swc_ecma_parser = { version = "41", optional = true, default-features = false, features = ["typescript"] }
swc_ecma_codegen = { version = "28", optional = true }
swc_ecma_transforms_typescript = { version = "50", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.0", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[[bin]]
name = "aike"
path = "src/main.rs"
