[package]
name = "aike"
version = "0.1.0"
edition = "2024"

[features]
cuda = ["llama-cpp-ffi/cuda"]
metal = ["llama-cpp-ffi/metal"]
enable_eval_log = []            # 启用 DeepEval 评估日志采集


[dependencies]
llama-cpp-ffi = { path = "../llama-cpp-ffi", features = ["cmake_static"] }
swiftlet-incremental = { path = "../swiftlet-incremental" }
zuqe = { path = "../../../devel/zhuque", features = [
    "crossbeam_channel",
    "serde_json_support",
] }
crossbeam = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
dotenvy = "0.15"
dotenvy_macro = "0.15"
glob = "0.3"
colorized = "1.0"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
anyhow = { version = "1", default-features = false }
env_logger = "0.9"
log = "0.4"
smallvec = "1.13"
linkme = "0.3"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "net",
    "time",
    "fs",
    "io-std",
    "process",
] }
minijinja = { version = "2", features = ["serde"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
chrono = "0.4"
axum = { version = "0.7", features = ["json", "macros"] }
futures-util = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
async-openai = { version = "0.37", features = ["chat-completion", "responses"] }
reqwest = { version = "0.12", features = [
    "json",
    "stream",
    "gzip",
    "brotli",
    "deflate",
] }
tokio-util = { version = "0.7", features = ["io"] }
reedline = "0.37"

[[bin]]
name = "aike"
path = "src/main.rs"
